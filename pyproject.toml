[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gui-gate"
version = "0.5.0"
description = "Cua Driver behind a pre-action value gate, served as one MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
# Cua Driver's own prebuilt wheels (macOS universal2, Linux x86_64/aarch64 glibc>=2.31, Windows x64/arm64):
# pip brings the driver in with gui-gate, nothing else is installed or compiled. Keep in step with
# gui_gate/install.py DRIVER_VERSION.
dependencies = ["cua-driver==0.37.0"]

[project.scripts]
gui-gate = "gui_gate.server:main"
gui-gate-train = "gui_gate.train:main"
gui-gate-compare = "gui_gate.compare:main"

[tool.setuptools]
packages = ["gui_gate"]
