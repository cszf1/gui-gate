# On a version tag: test, build the gate for every platform Cua Driver ships for, publish a GitHub
# release (binaries + SHA256SUMS + install.sh / install.ps1), then install it from that release on
# Linux, macOS and Windows exactly the way a user would.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --release && cargo build --release
      - run: GUI_GATE_BIN=target/release/gui-gate GUI_GATE_NO_UPDATE_CHECK=1 python3 -m unittest discover -s tests
      - run: bash -n scripts/install.sh

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, name: linux-x86_64, target: x86_64-unknown-linux-musl}
          - {os: ubuntu-24.04-arm, name: linux-aarch64, target: aarch64-unknown-linux-musl}
          - {os: macos-14, name: macos-universal, target: aarch64-apple-darwin}
          - {os: windows-latest, name: windows-x86_64, target: x86_64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - run: rustup target add ${{ matrix.target }}
      - if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin
      - name: build (Linux, static musl)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --target ${{ matrix.target }}
          mkdir out && cp target/${{ matrix.target }}/release/gui-gate out/
          file out/gui-gate && out/gui-gate --version
          tar -C out -czf gui-gate-${{ matrix.name }}.tar.gz gui-gate
      - name: build (macOS universal)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir out
          lipo -create -output out/gui-gate target/aarch64-apple-darwin/release/gui-gate target/x86_64-apple-darwin/release/gui-gate
          codesign --force -s - out/gui-gate
          lipo -info out/gui-gate && out/gui-gate --version
          tar -C out -czf gui-gate-${{ matrix.name }}.tar.gz gui-gate
      - name: build (Windows, static CRT)
        if: runner.os == 'Windows'
        shell: pwsh
        env: {RUSTFLAGS: "-C target-feature=+crt-static"}
        run: |
          cargo build --release --target ${{ matrix.target }}
          New-Item -ItemType Directory out | Out-Null
          Copy-Item target/${{ matrix.target }}/release/gui-gate.exe out/
          ./out/gui-gate.exe --version
          Compress-Archive -Path out/gui-gate.exe -DestinationPath gui-gate-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with: {name: "bin-${{ matrix.name }}", path: "gui-gate-${{ matrix.name }}.*"}

  release:
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: dist, merge-multiple: true}
      - run: |
          cp scripts/install.sh scripts/install.ps1 dist/
          cd dist && sha256sum gui-gate-* install.sh install.ps1 > SHA256SUMS && cat SHA256SUMS
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          cat > notes.md <<NOTES
          Install (gui-gate + the latest Cua Driver):

          macOS / Linux: \`curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | bash\`

          Windows (PowerShell): \`irm https://github.com/${{ github.repository }}/releases/latest/download/install.ps1 | iex\`
          NOTES
          gh release create "${{ github.ref_name }}" dist/* --title "gui-gate ${{ github.ref_name }}" --notes-file notes.md --latest

  install-smoke:
    needs: [release]
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]}
    runs-on: ${{ matrix.os }}
    steps:
      - name: install from the release (unix)
        if: runner.os != 'Windows'
        env: {GUI_GATE_VERSION: "${{ github.ref_name }}"}
        run: |
          curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/install.sh | bash 2>&1 | tee install.log
          export PATH="$HOME/.local/bin:$PATH"
          gui-gate --version
          # no reviewer yet: the install says so and the gate refuses to start, telling how to configure it
          grep -q "will NOT start" install.log
          if gui-gate </dev/null 2> refuse.txt; then echo "gate started without a reviewer" >&2; exit 1; fi
          cat refuse.txt
          grep -q "refusing to start" refuse.txt && grep -q "reviewer.env" refuse.txt && grep -q "gui-gate check-reviewer" refuse.txt
          if GUI_GATE_REVIEWER=off GUI_GATE_REVIEWER_URL=http://127.0.0.1:9/v1 GUI_GATE_REVIEWER_MODEL=m GUI_GATE_REVIEWER_KEY=k gui-gate </dev/null 2> off.txt; then exit 1; fi
          grep -q "cannot be turned off" off.txt
          # a dummy reviewer, non-interactively: saved to ~/.config/gui-gate (key file mode 600)
          curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/install.sh \
            | GUI_GATE_REVIEWER_KEY=dummy-key bash -s -- --skip-driver --reviewer-url http://127.0.0.1:9/v1 --reviewer-model dummy
          gui-gate check-reviewer --config-only
          test "$(stat -c %a "$HOME/.config/gui-gate/reviewer.key" 2>/dev/null || stat -f %Lp "$HOME/.config/gui-gate/reviewer.key")" = 600
          ! grep -q dummy-key "$HOME/.config/gui-gate/reviewer.env"
          gui-gate doctor | tee doctor.json || true
          python3 -c "import json; d=json.load(open('doctor.json')); print('driver', d['driver_version'], 'tools', d['driver_tools']); assert (d['driver_tools'] or 0) > 0"
      - name: upgrade from an older release leaves no residue (unix)
        if: runner.os != 'Windows'
        run: |
          set -eux
          export PATH="$HOME/.local/bin:$PATH"
          gui-gate uninstall
          test ! -e "$HOME/.local/bin/gui-gate"
          # old release + the junk old versions left
          curl -fsSL https://github.com/${{ github.repository }}/releases/download/v0.8.3/install.sh | bash -s -- --skip-driver
          printf '\n# gui-gate\nexport PATH="%s:$PATH"\n\n# gui-gate\nexport PATH="/gone/bin:$PATH"\n' "$HOME/.local/bin" >> "$HOME/.bashrc"
          mkdir -p "$HOME/.pi/agent" "$HOME/oldbin"
          cp "$HOME/.local/bin/gui-gate" "$HOME/oldbin/gui-gate"
          echo '{"mcpServers":{"gui":{"command":"'$HOME'/oldbin/gui-gate","args":["--decider","model"]}}}' > "$HOME/.pi/agent/mcp.json"
          cp "$HOME/.pi/agent/mcp.json" "$HOME/.pi/agent/mcp.json.bak"
          touch "$HOME/.local/bin/.gui-gate.new"
          export PATH="$HOME/oldbin:$PATH"
          curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/install.sh | bash -s -- --skip-driver
          gui-gate --version
          test ! -e "$HOME/oldbin/gui-gate"
          test ! -e "$HOME/.local/bin/.gui-gate.new"
          test ! -e "$HOME/.pi/agent/mcp.json.bak"
          test "$(grep -c '^# gui-gate' "$HOME/.bashrc")" -le 1
          ! grep -q /gone/bin "$HOME/.bashrc"
          python3 -c "import json,os; e=json.load(open(os.path.expanduser('~/.pi/agent/mcp.json')))['mcpServers']['gui']; print(e); assert e['command']==os.path.expanduser('~/.local/bin/gui-gate') and '--decider' not in e['args']"
          test -z "$(gui-gate cleanup --quiet)"
      - name: install from the release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env: {GUI_GATE_VERSION: "${{ github.ref_name }}"}
        run: |
          irm https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/install.ps1 | iex
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\gui-gate\bin\gui-gate.exe'
          & $exe --version
          # no reviewer yet: the gate refuses to start, telling how to configure it
          New-Item -ItemType File -Force empty.txt | Out-Null
          $p = Start-Process -FilePath $exe -NoNewWindow -Wait -PassThru -RedirectStandardInput empty.txt -RedirectStandardError refuse.txt -RedirectStandardOutput out.txt
          Get-Content refuse.txt
          if ($p.ExitCode -eq 0) { throw "gate started without a reviewer" }
          if (-not (Select-String -Path refuse.txt -Pattern 'refusing to start' -Quiet)) { throw "no refusal message" }
          if (-not (Select-String -Path refuse.txt -Pattern 'gui-gate check-reviewer' -Quiet)) { throw "refusal does not say how to check" }
          # a dummy reviewer, non-interactively (env vars; irm | iex takes no arguments)
          $env:GUI_GATE_SKIP_DRIVER = '1'
          $env:GUI_GATE_REVIEWER_URL = 'http://127.0.0.1:9/v1'; $env:GUI_GATE_REVIEWER_MODEL = 'dummy'; $env:GUI_GATE_REVIEWER_KEY = 'dummy-key'
          irm https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/install.ps1 | iex
          Remove-Item Env:GUI_GATE_SKIP_DRIVER
          if ($env:GUI_GATE_REVIEWER_KEY) { throw "the installer left the key in the environment" }
          & $exe check-reviewer --config-only
          if ($LASTEXITCODE -ne 0) { throw "reviewer not configured by the installer" }
          $revEnv = Join-Path $(if ($env:HOME) { $env:HOME } else { $env:USERPROFILE }) '.config\gui-gate\reviewer.env'
          if (-not (Test-Path $revEnv)) { throw "no $revEnv" }
          if (Select-String -Path $revEnv -Pattern 'dummy-key' -Quiet) { throw "key written to reviewer.env" }
          $out = & $exe doctor
          $out | Out-File doctor.json
          $d = Get-Content doctor.json -Raw | ConvertFrom-Json
          Write-Host "driver $($d.driver_version) tools $($d.driver_tools)"
          if (-not $d.driver_tools) { exit 1 }
      - name: upgrade from an older release leaves no residue (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $env:LOCALAPPDATA 'Programs\gui-gate\bin'
          $exe = Join-Path $bin 'gui-gate.exe'
          & $exe uninstall
          Start-Sleep -Seconds 5
          if (Test-Path $exe) { throw "uninstall left $exe" }
          if ((([Environment]::GetEnvironmentVariable('Path','User')) -split ';') -contains $bin) { throw "uninstall left the Path entry" }
          $env:GUI_GATE_SKIP_DRIVER = '1'
          $env:GUI_GATE_VERSION = '0.8.3'
          irm https://github.com/${{ github.repository }}/releases/download/v0.8.3/install.ps1 | iex
          # junk: a duplicate and a stale user Path entry, our own backup, an old exe
          $p = [Environment]::GetEnvironmentVariable('Path','User')
          [Environment]::SetEnvironmentVariable('Path', "$p;$bin;C:\gone\gui-gate\bin", 'User')
          New-Item -ItemType Directory -Force (Join-Path $HOME '.pi\agent') | Out-Null
          $cfg = Join-Path $HOME '.pi\agent\mcp.json'
          ('{"mcpServers":{"gui":{"command":"' + ($exe -replace '\\','\\') + '","args":["--decider","model"]}}}') | Set-Content $cfg
          Copy-Item $cfg "$cfg.bak"
          $env:GUI_GATE_VERSION = '${{ github.ref_name }}'
          irm https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/install.ps1 | iex
          & $exe --version
          Start-Sleep -Seconds 6
          & $exe cleanup --quiet
          $entries = ([Environment]::GetEnvironmentVariable('Path','User')) -split ';'
          if (($entries | Where-Object { $_ -eq $bin }).Count -ne 1) { throw "user Path should hold the gui-gate dir once: $entries" }
          if ($entries -contains 'C:\gone\gui-gate\bin') { throw "stale Path entry left" }
          if (Test-Path "$cfg.bak") { throw "backup left" }
          if (Test-Path "$exe.old") { throw "gui-gate.exe.old left" }
          $e = (Get-Content $cfg -Raw | ConvertFrom-Json).mcpServers.gui
          if ($e.args -contains '--decider') { throw "removed flag left: $($e.args)" }
          $left = & $exe cleanup --quiet
          if ($left) { throw "second cleanup still found: $left" }
