# Build the gate for every platform Cua Driver ships for, and publish the wheels when a version tag is pushed.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  wheels:
    strategy:
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64, manylinux: "2_31"}
          - {os: ubuntu-latest, target: aarch64, manylinux: "2_31"}
          - {os: macos-14, target: universal2-apple-darwin}
          - {os: windows-latest, target: x64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with: {name: "wheel-${{ matrix.os }}-${{ matrix.target }}", path: dist}
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --release && cargo build --release
      - run: GUI_GATE_BIN=target/release/gui-gate python3 -m unittest discover -s tests
  publish:
    needs: [wheels, test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions: {id-token: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {path: dist, merge-multiple: true}
      - uses: pypa/gh-action-pypi-publish@release/v1
